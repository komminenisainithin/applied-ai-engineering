[project]
name = "applied-ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sai Nithin", email = "jagannadhasainithinkommineni@gmail.com" }
]
requires-python = ">=3.13"
